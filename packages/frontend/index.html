<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIIP Platform</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
    </style>
    <script>
      // DOMContentLoaded 체크와 전역 오류/Promise rejection 캡처기 추가
      window.addEventListener('DOMContentLoaded', () => {
        console.log('✅ DOM Content Loaded');

        // 3초 뒤에도 React가 마운트되지 않으면 로딩 영역에 상태를 표시하도록 함
        setTimeout(() => {
          const root = document.getElementById('root');
          const loading = document.getElementById('loading');

          if (root && root.children.length === 0) {
            const msg = '❌ React not mounted after 3 seconds. Check console for errors.';
            console.error(msg);
            if (loading) {
              loading.innerHTML = `<h2>${msg}</h2><pre id="__error_details" style="white-space:pre-wrap;margin-top:8px;max-width:680px;overflow:auto;font-size:12px;color:#c62828"></pre>`;
            }
          } else {
            console.log('✅ React mounted successfully');
            if (loading) loading.remove();
          }
        }, 3000);
      });

      // 전역 오류 포착: 화면의 loading 영역에 에러 스택을 출력합니다.
      function displayError(message) {
        console.error(message);
        const loading = document.getElementById('loading');
        if (loading) {
          const detailsEl = document.getElementById('__error_details');
          if (detailsEl) {
            detailsEl.textContent += '\n' + message;
          } else {
            const pre = document.createElement('pre');
            pre.id = '__error_details';
            pre.style.whiteSpace = 'pre-wrap';
            pre.style.marginTop = '8px';
            pre.style.maxWidth = '680px';
            pre.style.overflow = 'auto';
            pre.style.fontSize = '12px';
            pre.style.color = '#c62828';
            pre.textContent = message;
            loading.appendChild(pre);
          }
        }
      }

      window.addEventListener('error', function (ev) {
        const msg =
          ev && ev.error && ev.error.stack
            ? ev.error.stack
            : ev && ev.message
              ? ev.message
              : String(ev);
        displayError('Unhandled error: ' + msg);
      });

      window.addEventListener('unhandledrejection', function (ev) {
        const reason = ev && ev.reason ? ev.reason.stack || JSON.stringify(ev.reason) : 'unknown';
        displayError('Unhandled rejection: ' + reason);
      });
    </script>
  </head>
  <body>
    <div id="loading">
      <h2>🔄 PIIP Platform 로딩 중...</h2>
      <p>잠시만 기다려주세요</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
