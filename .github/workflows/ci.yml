name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E tests'
        required: false
        default: 'false'

jobs:
  build:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            packages/frontend/node_modules
            packages/backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci

      - name: Lint (repo)
        run: npm run lint || true

      - name: Build (monorepo)
        run: npm run build

      - name: Backend: install & test
        run: |
          cd packages/backend
          npm ci
          npm run test --silent || true

      - name: Frontend: install & build
        run: |
          cd packages/frontend
          npm ci
          npm run build

      - name: Playwright E2E (run on PRs or when requested)
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.run_e2e == 'true' || env.RUN_E2E == 'true' }}
        env:
          VITE_API_BASE: http://localhost:5001
          NODE_ENV: test
        run: |
          cd packages/frontend
          npx playwright install --with-deps
          npx playwright test --workers=1 --timeout=60000 --reporter=list,junit

      - name: Publish Playwright JUnit to GitHub Checks
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright
          path: packages/frontend/test-results/**/*.xml
          reporter: junit

      - name: Upload Playwright artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            packages/frontend/test-results/**
            packages/frontend/playwright-report/**

      - name: Upload coverage (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/**/coverage/**

  docker-e2e:
    name: Dockerized E2E (compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker (optional)
        if: env.DOCKER_USERNAME
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build & start services with docker-compose
        run: |
          docker compose -f docker-compose.yml up -d --build

      - name: Wait for backend health
        run: |
          echo "Waiting for backend health endpoint..."
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5001/health >/dev/null 2>&1; then
              echo "Backend healthy"; break
            fi
            echo "Waiting... ($i)"; sleep 2
          done

      - name: Run Playwright E2E against compose
        env:
          VITE_API_BASE: http://localhost:5001
        run: |
          cd packages/frontend
          npx playwright install --with-deps
          npx playwright test --workers=1 --timeout=60000 --reporter=list,junit

      - name: Publish Playwright JUnit to GitHub Checks (compose)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright-compose
          path: packages/frontend/test-results/**/*.xml
          reporter: junit

      - name: Upload Playwright artifacts from compose run (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-compose-failure
          path: |
            packages/frontend/test-results/**
            packages/frontend/playwright-report/**

      - name: Collect docker-compose logs (failure only)
        if: failure()
        run: |
          mkdir -p ./artifacts/docker-logs
          services=(piip-backend piip-frontend piip-mobile piip-mongo)
          for s in "${services[@]}"; do
            echo "Collecting logs for $s"
            docker logs --tail 2000 "$s" > ./artifacts/docker-logs/${s}-${{ github.run_id }}.log 2>&1 || echo "no logs for $s"
          done

      - name: Upload docker logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: ./artifacts/docker-logs/**

      - name: Teardown compose
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
