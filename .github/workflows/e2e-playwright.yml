name: Playwright E2E (docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Bring up services with docker-compose
        run: |
          docker compose up -d --build
        working-directory: ${{ github.workspace }}

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:5001/health >/dev/null 2>&1; then echo OK && break; fi
            echo "waiting for backend... ($i)"; sleep 2;
          done

      - name: Run Playwright tests
        working-directory: packages/frontend
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright test --reporter=dot --trace on || true

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/frontend/test-results/**/trace.zip

      - name: Upload docker-compose logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose logs --no-color > ci-logs/docker-compose.log || true
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Upload docker logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: ci-logs/docker-compose.log

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
