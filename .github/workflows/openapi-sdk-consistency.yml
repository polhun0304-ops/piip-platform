name: OpenAPI SDK consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC에 정기 실행

concurrency:
  group: openapi-sdk-consistency-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SDK from OpenAPI
        run: npm run openapi:gen

      - name: Auto commit SDK changes (PR only)
        if: github.event_name == 'pull_request' && always()
        run: |
          if [[ -n "$(git status --porcelain packages/sdk)" ]]; then
            echo "Changes detected in SDK – committing to PR branch.";
            git config user.name "github-actions[bot]";
            git config user.email "github-actions[bot]@users.noreply.github.com";
            git add packages/sdk;
            git commit -m "chore: sync SDK with OpenAPI spec" || true;
            git push origin HEAD:${{ github.head_ref }} || echo "Push failed (maybe permissions)";
          else
            echo "No SDK drift detected";
          fi

      - name: Create PR for SDK drift (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync SDK with OpenAPI spec"
          title: "chore: Sync SDK with OpenAPI spec"
          body: |
            This PR synchronizes the generated SDK with the latest OpenAPI spec.
            - Generated by CI on push to main
            - Please review and merge
          branch: bot/openapi-sdk-sync
          delete-branch: true
          add-paths: |
            packages/sdk/**
          labels: chore, openapi, sdk
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.repository_owner }}

      - name: Fail if SDK drift (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain packages/sdk)" ]]; then
            echo "SDK drift detected on main. Please regenerate and commit." >&2
            git status --porcelain packages/sdk
            exit 1
          fi

      - name: Run server tests
        run: npm run -w @piip/server test
