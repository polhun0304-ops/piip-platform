openapi: 3.1.0
info:
  title: PIIP API
  version: 0.1.0
  description: |
    PIIP 사건/증거/리포트/결제 플랫폼 API 초기 스펙.
    - 버전: Draft 0.1
    - 상태: INTERNAL DRAFT (실제 구현과 차이 가능)
    - 인증: Bearer JWT
servers:
  - url: https://api.piip.local
    description: Local / Dev
  - url: https://staging.api.piip.example
    description: Staging
  - url: https://api.piip.example
    description: Production
security:
  - bearerAuth: []
  - oauth2: ["cases:read"]
tags:
  - name: Auth
    description: 인증 및 사용자 세션
  - name: Cases
    description: 사건 CRUD 및 상태 관리
  - name: Evidences
    description: 증거 업로드/검색/무결성
  - name: Reports
    description: 리포트 작성/승인
  - name: Payments
    description: 결제 / 정산
  - name: Notifications
    description: 알림 구독 및 읽음 처리

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              basic:
                summary: 기본 로그인
                value: { email: user@example.com, password: "Passw0rd!" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 사용자 정보
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cases:
    get:
      tags: [Cases]
      summary: 사건 목록 조회
      operationId: listCases
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/CaseStatus" }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      security:
        - oauth2: ["cases:read"]
        - bearerAuth: []
      responses:
        "200":
          description: 사건 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Case" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      tags: [Cases]
      summary: 사건 생성
      operationId: createCase
      security:
        - oauth2: ["cases:write"]
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreate" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /cases/{caseId}:
    get:
      tags: [Cases]
      summary: 사건 상세
      operationId: getCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Cases]
      summary: 사건 일부 수정
      operationId: updateCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, normal, high, urgent] }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /cases/{caseId}/status:
    post:
      tags: [Cases]
      summary: 사건 상태 전이
      operationId: transitionCaseStatus
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/CaseStatus" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 상태 변경 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "409":
          description: 허용되지 않은 전이
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /evidences:
    post:
      tags: [Evidences]
      summary: 증거 업로드
      operationId: uploadEvidence
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [caseId, file]
              properties:
                caseId: { type: string, format: uuid }
                file: { type: string, format: binary }
                type:
                  { type: string, enum: [image, audio, video, document, other] }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: 업로드 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /evidences/{evidenceId}:
    get:
      tags: [Evidences]
      summary: 증거 상세
      operationId: getEvidence
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "404":
          $ref: "#/components/responses/NotFound"

  /reports:
    post:
      tags: [Reports]
      summary: 리포트 초안 생성
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, title]
              properties:
                caseId: { type: string, format: uuid }
                title: { type: string }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: 리포트 조회
      operationId: getReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Reports]
      summary: 리포트 블록/본문 수정
      operationId: updateReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string }
                body: { type: object }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /reports/{reportId}/submit:
    post:
      tags: [Reports]
      summary: 리포트 제출(검토 요청)
      operationId: submitReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: 제출됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /payments/intents:
    post:
      tags: [Payments]
      summary: 결제 Intent 생성
      operationId: createPaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, amount]
              properties:
                caseId: { type: string, format: uuid }
                amount: { type: number, minimum: 0 }
                currency: { type: string, default: KRW }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /payments/intents/{intentId}:
    get:
      tags: [Payments]
      summary: PaymentIntent 조회
      operationId: getPaymentIntent
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.piip.local/oauth/token
          scopes:
            cases:read: 사건 조회 권한
            cases:write: 사건 작성/수정 권한
            evidences:upload: 증거 업로드 권한
            reports:read: 리포트 조회 권한
            reports:write: 리포트 작성/수정 권한
            payments:read: 결제 조회 권한
            payments:write: 결제 생성/변경 권한
            admin:all: 관리자 전체 권한
        authorizationCode:
          authorizationUrl: https://api.piip.local/oauth/authorize
          tokenUrl: https://api.piip.local/oauth/token
          scopes:
            cases:read: 사건 조회 권한
            cases:write: 사건 작성/수정 권한
            evidences:upload: 증거 업로드 권한
            reports:read: 리포트 조회 권한
            reports:write: 리포트 작성/수정 권한
            payments:read: 결제 조회 권한
            payments:write: 결제 생성/변경 권한
            admin:all: 관리자 전체 권한

  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CaseId:
      in: path
      name: caseId
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      in: path
      name: evidenceId
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      in: path
      name: reportId
      required: true
      schema: { type: string, format: uuid }
    PaymentIntentId:
      in: path
      name: intentId
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: 유효성 검사 실패
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  details:
                    type: object
                    additionalProperties: true

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/UserSummary" }

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [client, detective, admin] }
        name: { type: string }

    CaseStatus:
      type: string
      enum:
        [
          DRAFT,
          REVIEW,
          ACTIVE,
          EVIDENCE_COLLECTION,
          REPORT_DRAFT,
          REPORT_REVIEW,
          CLOSED,
        ]

    Case:
      type: object
      required: [id, status, title]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        title: { type: string }
        description: { type: string }
        clientId: { type: string, format: uuid }
        assignedDetectiveId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CaseCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        priority:
          { type: string, enum: [low, normal, high, urgent], default: normal }

    Evidence:
      type: object
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        type: { type: string, enum: [image, audio, video, document, other] }
        url: { type: string, format: uri }
        mimeType: { type: string }
        size: { type: integer }
        checksum: { type: string }
        ocrText: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        status: { type: string, enum: [draft, in_review, approved, rejected] }
        version: { type: integer }
        title: { type: string }
        summary: { type: string }
        body: { type: object }

    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        status:
          {
            type: string,
            enum: [pending, authorized, captured, canceled, failed],
          }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

webhooks:
  ocr.completed:
    post:
      summary: OCR 처리 완료 이벤트
      description: 증거 OCR 처리가 완료되었을 때 구독자에게 전달됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, evidence]
              properties:
                event:
                  type: string
                  enum: [ocr.completed]
                evidence:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    caseId: { type: string, format: uuid }
                    ocrText: { type: string }
                    completedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 수신 성공
  report.reviewed:
    post:
      summary: 리포트 승인/반려 이벤트
      description: 리포트가 검토 완료되어 승인 또는 반려되었을 때 전달됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, report]
              properties:
                event:
                  type: string
                  enum: [report.reviewed]
                report:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    caseId: { type: string, format: uuid }
                    status: { type: string, enum: [approved, rejected] }
                    reviewedAt: { type: string, format: date-time }
                    reason: { type: string, nullable: true }
      responses:
        "200":
          description: 수신 성공
