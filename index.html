<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="할 일 관리 앱: 작업을 추가, 완료, 삭제할 수 있습니다."
    />
    <title>할 일 관리자</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body>
    <div class="app-wrapper">
      <button
        class="theme-toggle"
        aria-label="테마 전환"
        onclick="toggleTheme()"
      >
        <span class="material-icons" aria-hidden="true">dark_mode</span>
        <span>다크 모드</span>
      </button>

      <header class="app-header">
        <h1>할 일 관리자</h1>
      </header>

      <main class="container">
        <section class="task-input-section">
          <form id="task-form" aria-label="새 작업 추가">
            <div class="input-group">
              <input
                type="text"
                id="task-input"
                placeholder="새 작업 추가"
                aria-label="작업 내용"
                required
              />
              <button type="submit" class="btn-primary">
                <span class="material-icons" aria-hidden="true">add</span>
                추가
              </button>
            </div>
          </form>
        </section>

        <section class="task-filters" aria-label="작업 필터">
          <div class="filter-buttons" role="group" aria-label="작업 상태 필터">
            <button class="btn-filter active" data-filter="all">전체</button>
            <button class="btn-filter" data-filter="active">진행 중</button>
            <button class="btn-filter" data-filter="completed">완료</button>
          </div>
        </section>

        <section class="tasks-section">
          <h2 class="visually-hidden">작업 목록</h2>
          <ul id="task-list" class="task-list" aria-label="작업 목록">
            <!-- 작업 항목들이 여기에 동적으로 추가됩니다 -->
          </ul>
        </section>

        <section class="task-summary">
          <p id="tasks-count" aria-live="polite">
            총 작업: <span id="total-count">0</span> | 완료:
            <span id="completed-count">0</span>
          </p>
          <button id="clear-completed" class="btn-secondary" disabled>
            완료된 작업 삭제
          </button>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
